# /etc/nginx/sites-available/relay  (poi: ln -s in sites-enabled, nginx -t, systemctl reload nginx)
#
# Cloudflare: DNS record "relay" -> IP del VPS con proxy attivo (nuvola arancione),
# SSL/TLS mode = "Full (strict)".
# Certificato sul VPS: Cloudflare Origin Certificate (Dashboard > SSL/TLS > Origin Server)
# oppure Let's Encrypt via certbot con challenge DNS.

# IP reale del visitatore da Cloudflare (lista completa: https://www.cloudflare.com/ips/)
# Consigliato: mettere le righe set_real_ip_from in /etc/nginx/cloudflare-ips.conf e includerlo qui.
# include /etc/nginx/cloudflare-ips.conf;
# real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;   # <-- il tuo dominio

    ssl_certificate     /etc/ssl/relay/origin.pem;
    ssl_certificate_key /etc/ssl/relay/origin.key;

    # Segmenti HLS: pochi MB ciascuno. Limite Cloudflare: 100 MB per richiesta.
    client_max_body_size 64m;

    # API Rust (upload, playlist, segmenti, WebSocket)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (comando di start/stop agli agenti)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # gli upload non vengono bufferizzati su disco da nginx
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Sito Next.js (fase 5), sullo stesso dominio cosi i cookie valgono anche per l'API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
