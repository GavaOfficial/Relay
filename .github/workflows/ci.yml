name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Formattazione
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release
      - name: Pacchetto di registrazione (x64 e x86)
        shell: pwsh
        run: ./deploy/build-capture.ps1 -Zip -BuildDir target
      - uses: actions/upload-artifact@v4
        with:
          name: relay-windows
          path: |
            target/release/relay-app.exe
            dist/relay-recorder.zip
          retention-days: 14

  rust-linux:
    name: Server e programmi Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: cargo test -p relay-common -p relay-server -p relay-storage -p relay-ops
      - name: Build release
        run: cargo build --release -p relay-server -p relay-storage -p relay-ops
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux
          path: |
            target/release/relay-server
            target/release/relay-storage
            target/release/relay-ops
          retention-days: 14

  web:
    name: Sito (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/web/package-lock.json
      - run: npm ci
      - name: Tipi
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
