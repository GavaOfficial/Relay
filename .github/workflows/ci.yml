name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Formattazione
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release
      - name: Aggancio a 32 bit (DLL, iniettore, layer Vulkan)
        run: |
          cargo build --release --target i686-pc-windows-msvc -p relay-hook -p relay-inject -p relay-vk-layer
          cargo test --release --target i686-pc-windows-msvc -p relay-hook-protocol --lib
      - name: Pacchetto di registrazione
        shell: pwsh
        run: |
          $out = 'dist/capture-runtime'
          New-Item -ItemType Directory -Force -Path "$out/hooks/x64", "$out/hooks/x86" | Out-Null
          Copy-Item target/release/relay-capture.exe $out
          foreach ($f in 'relay_hook.dll', 'relay-inject.exe', 'relay_vk_layer.dll') {
            Copy-Item "target/release/$f" "$out/hooks/x64"
            Copy-Item "target/i686-pc-windows-msvc/release/$f" "$out/hooks/x86"
          }
          Copy-Item client/capture/vk-layer/relay-vk-layer.json "$out/hooks/x64"
          Copy-Item client/capture/vk-layer/relay-vk-layer.json "$out/hooks/x86"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-windows
          path: |
            target/release/relay-app.exe
            dist/capture-runtime
          retention-days: 14

  rust-linux:
    name: Server e programmi Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: cargo test -p relay-common -p relay-server -p relay-storage -p relay-ops
      - name: Build release
        run: cargo build --release -p relay-server -p relay-storage -p relay-ops
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux
          path: |
            target/release/relay-server
            target/release/relay-storage
            target/release/relay-ops
          retention-days: 14

  web:
    name: Sito (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/web/package-lock.json
      - run: npm ci
      - name: Tipi
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
