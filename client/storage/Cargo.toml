[package]
name = "relay-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server di archivio dei video di Relay: si collega al centrale con un tunnel e conserva i file cifrati"

[dependencies]
relay-common = { path = "../../common" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ed25519-dalek = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
