[package]
name = "relay-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Motore di registrazione di Relay: Windows.Graphics.Capture, Media Foundation, WASAPI e segmenti HLS"

[dependencies]
anyhow = "1"

[target.'cfg(windows)'.dependencies]
relay-hook-protocol = { path = "../protocol" }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Graphics_OpenGL", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
wasapi = "0.24"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "relay-zoo-opengl"
path = "tests/zoo/opengl.rs"

[[example]]
name = "relay-zoo-check"
path = "tests/zoo/check.rs"
[[example]]
name = "relay-zoo-dxgi"
path = "tests/zoo/dxgi.rs"
[target.'cfg(windows)'.dev-dependencies]
ash = "0.38"

[[example]]
name = "relay-zoo-vulkan"
path = "tests/zoo/vulkan.rs"

[[example]]
name = "relay-zoo-dx10"
path = "tests/zoo/dx10.rs"

[[example]]
name = "relay-zoo-dx12"
path = "tests/zoo/dx12.rs"

[[example]]
name = "relay-zoo-d3d9"
path = "tests/zoo/d3d9.rs"
