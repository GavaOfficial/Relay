[package]
name = "relay-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "relay_agent"
path = "src/lib.rs"

[[bin]]
name = "relay-agent"
path = "src/main.rs"

[dependencies]
relay-common = { path = "../../common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
getrandom = "0.3"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
futures-util = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_Security"] }
